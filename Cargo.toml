[package]
name = "near-lan"
version = "0.1.0"
description = "LAN-only file transfer hub"
license = "Apache-2.0"
repository = "https://github.com/CallMeAlphabet/near"
homepage = "https://github.com/CallMeAlphabet/near"
readme = "README.md"
edition = "2021"
rust-version = "1.85"
keywords = ["lan", "webrtc", "file-transfer", "p2p"]
categories = ["command-line-utilities", "network-programming"]
exclude = ["packaging/", "flake.nix", "flake.lock", "rust-toolchain.toml"]

[[bin]]
name = "near"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
libc = "0.2"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "=0.3.41"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time", "sync", "signal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
