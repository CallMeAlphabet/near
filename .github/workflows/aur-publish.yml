name: aur-publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.*'
      - '.*/**'
      - 'packaging/**'

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm base-devel git openssh curl

      # near is semver-versioned and its AUR source package builds the published
      # crate, so keep pkgver from Cargo.toml instead of the run number. The other
      # repos use run-number pkgver plus a pinned _commit archive; that would point
      # the .crate source at a version that does not exist.
      - name: Set up SSH, clone, sync version, and push to AUR
        run: |
          set -e
          mkdir -p /tmp/ssh
          echo "$AUR_SSH_PRIVATE_KEY" > /tmp/ssh/aur_key
          chmod 600 /tmp/ssh/aur_key
          export GIT_SSH_COMMAND="ssh -i /tmp/ssh/aur_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          git clone ssh://aur@aur.archlinux.org/near.git /tmp/aur-repo
          cd /tmp/aur-repo
          if [ ! -f PKGBUILD ]; then
            echo "near AUR repo has no PKGBUILD yet - skipping (seed it first)"
            exit 0
          fi

          CRATE_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/Cargo.toml" | grep '^version' | head -1 | cut -d'"' -f2)
          sed -i "s/^pkgver=.*/pkgver=$CRATE_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          useradd -m builduser
          chown -R builduser:builduser /tmp/aur-repo
          git config --global --add safe.directory /tmp/aur-repo
          su builduser -c "cd /tmp/aur-repo && makepkg --printsrcinfo > .SRCINFO"

          git config user.name "CallMeAlphabet"
          git config user.email "sigma.alphabet@proton.me"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Sync to crate $CRATE_VERSION"
            git push
          fi
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
