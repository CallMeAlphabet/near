name: aur-bin-publish

# Runs after the release workflow has finished uploading binaries, so
# the AUR package is never bumped before the assets it points at exist.
# workflow_dispatch lets you refresh the package without a new release.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  aur-bin-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install tools
        run: pacman -Sy --noconfirm base-devel git openssh pacman-contrib curl jq

      - name: Push near-bin to AUR
        run: |
          set -e
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY is not set - skipping"
            exit 0
          fi
          # A cancelled macOS matrix job makes the whole release run conclude
          # "cancelled", even when the release job published every Linux asset.
          # Check the release job itself instead of the run conclusion.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RELEASE_JOB=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/jobs?per_page=100" \
              | jq -r '[.jobs[] | select(.name == "release") | .conclusion][0] // "missing"')
            if [ "$RELEASE_JOB" != "success" ]; then
              echo "release job did not succeed ($RELEASE_JOB) - skipping"
              exit 0
            fi
          else
            echo "manual dispatch - using the current latest release assets"
          fi

          mkdir -p /tmp/ssh
          echo "$AUR_SSH_PRIVATE_KEY" > /tmp/ssh/aur_key
          chmod 600 /tmp/ssh/aur_key
          export GIT_SSH_COMMAND="ssh -i /tmp/ssh/aur_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          git clone ssh://aur@aur.archlinux.org/near-bin.git /tmp/aur-bin
          cd /tmp/aur-bin
          if [ ! -f PKGBUILD ]; then
            echo "near-bin AUR repo has no PKGBUILD yet - skipping (seed it first)"
            exit 0
          fi

          # Keep near-bin on a monotonic 0.1.N version instead of jumping from
          # 0.1.0 to a bare run number.
          RUN_NUMBER="${{ github.event.workflow_run.run_number || github.run_number }}"
          NEW_VERSION="0.1.$RUN_NUMBER"
          sed -i "s/^pkgver=.*/pkgver=$NEW_VERSION/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

          useradd -m builduser
          chown -R builduser:builduser /tmp/aur-bin
          git config --global --add safe.directory /tmp/aur-bin
          su builduser -c "cd /tmp/aur-bin && updpkgsums && makepkg --printsrcinfo > .SRCINFO"

          git config user.name "CallMeAlphabet"
          git config user.email "sigma.alphabet@proton.me"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No changes to push"
          else
            git commit -m "Auto-bump to build $RUN_NUMBER"
            git push
          fi
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
